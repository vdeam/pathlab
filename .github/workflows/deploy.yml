name: Deploy

on:
  push:
    branches: [main]
  # Lets the workflow be triggered by hand from the Actions tab, without a new push.
  workflow_dispatch:

# Only one deploy runs at a time; a newer push cancels one still in flight rather than
# racing it to publish.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site from /<repo>/, not from the domain root, so the build has to
      # know that path up front: every asset URL is written relative to it at build time.
      - run: npm run build --workspace @pathlab/web -- --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
